<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Distributor Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0fdf4;
        }

        .navbar {
            background: #047857;
            color: white;
            padding: 18px 30px;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        h1 {
            color: #064e3b;
        }

        .badge {
            display: inline-block;
            padding: 8px 15px;
            background: #047857;
            color: white;
            border-radius: 20px;
        }
    </style>
</head>

<body>

<div class="navbar">
    <strong>Advance Billing System</strong>
</div>

<a
    href="{% url 'distributor_profile' %}"
    style="
        display:inline-block;
        padding:11px 18px;
        background:#047857;
        color:white;
        text-decoration:none;
        border-radius:8px;
        font-size:14px;
        font-weight:600;
    "
>
    My Profile
</a>

<div class="container">

    <div class="card">

        <span class="badge">DISTRIBUTOR</span>

        <h1>Welcome to Distributor Dashboard</h1>

        <p>
            Distributor login route and dashboard are working successfully.
        </p>

    </div>

    <a
        href="{% url 'add_customer' %}"
        style="
            display:inline-block;
            padding:12px 20px;
            background:#047857;
            color:white;
            text-decoration:none;
            border-radius:9px;
            font-size:13px;
            font-weight:700;
        "
    >
        + Add Customer
    </a>

    <a href="{% url 'user_logout' %}">
        Logout
    </a>

</div>

</body>
</html>
