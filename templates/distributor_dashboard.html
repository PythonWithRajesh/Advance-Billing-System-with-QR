<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributor Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0fdf4;
            color: #1f2937;
        }

        /* Navbar Layout */
        .navbar {
            background: #047857;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .navbar .brand {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .btn-profile {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-profile:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .btn-logout {
            background: #dc2626;
            color: white;
        }

        .btn-logout:hover {
            background: #b91c1c;
        }

        /* Container Layout */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Hero Welcome Card */
        .welcome-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-left: 6px solid #047857;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: #dcfce7;
            color: #166534;
            font-weight: 700;
            font-size: 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .welcome-card h1 {
            color: #064e3b;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .welcome-card p {
            color: #4b5563;
            font-size: 15px;
        }

        /* Actions Section Title */
        .section-title {
            font-size: 18px;
            color: #064e3b;
            margin-bottom: 15px;
            font-weight: 600;
        }

        /* Grid for Buttons */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        /* Action Card Buttons */
        .action-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .action-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        /* Primary Add Actions */
        .action-card.primary {
            background: #047857;
            color: white;
            border-color: #047857;
        }

        .action-card.primary:hover {
            background: #065f46;
        }

        .action-card.primary .action-title {
            color: white;
        }

        /* Secondary View Actions */
        .action-card.secondary {
            background: white;
            color: #047857;
        }

        .action-card.secondary:hover {
            border-color: #047857;
        }

        .action-title {
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
        }
    </style>
</head>

<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="brand">Advance Billing System</div>
        <div class="navbar-actions">
            <a href="{% url 'distributor_profile' %}" class="nav-btn btn-profile">My Profile</a>
            <a href="{% url 'user_logout' %}" class="nav-btn btn-logout">Logout</a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">

        <!-- Welcome Banner Card -->
        <div class="welcome-card">
            <span class="badge">Distributor</span>
            <h1>Welcome to Distributor Dashboard</h1>
            <p>Distributor login route and dashboard are working successfully.</p>
        </div>

        <!-- Dashboard Quick Actions -->
        <h2 class="section-title">Quick Actions</h2>
        
        <div class="action-grid">
            <!-- Add Actions (Primary) -->
            <a href="{% url 'add_customer' %}" class="action-card primary">
                <span class="action-title">+ Add Customer</span>
            </a>

            <a href="{% url 'add_product' %}" class="action-card primary">
                <span class="action-title">+ Add Product</span>
            </a>

            <!-- View Actions (Secondary) -->
            <a href="{% url 'customer_list' %}" class="action-card secondary">
                <span class="action-title">View Customers</span>
            </a>

            <a href="{% url 'product_list' %}" class="action-card secondary">
                <span class="action-title">View Products</span>
            </a>
        </div>

    </div>

</body>
</html>
