<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 30px;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        h1 {
            color: #111827;
        }

        .badge {
            display: inline-block;
            padding: 8px 15px;
            background: #111827;
            color: white;
            border-radius: 20px;
        }
    </style>
</head>

<body>

<div class="navbar">
    <strong>Advance Billing System</strong>

</div>

<div class="container">

    <div class="card">

        <span class="badge">ADMIN</span>

        <h1>Welcome to Admin Dashboard</h1>

        <p>
            Admin login route and dashboard are working successfully.
        </p>

    </div>
    <a href="{% url 'user_logout' %}">
        Logout
    </a>

</div>

</body>
</html>
