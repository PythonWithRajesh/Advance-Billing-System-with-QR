<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f8fafc;
            color: #0f172a;
        }

        /* Navbar */
        .navbar {
            background: #0f172a;
            color: white;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .navbar .brand {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-logout {
            background: #ef4444;
            color: white;
        }

        .btn-logout:hover {
            background: #dc2626;
        }

        /* Container */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Welcome Card */
        .welcome-card {
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            border-left: 6px solid #0f172a;
            margin-bottom: 32px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: #e2e8f0;
            color: #0f172a;
            font-weight: 700;
            font-size: 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .welcome-card h1 {
            color: #0f172a;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .welcome-card p {
            color: #64748b;
            font-size: 15px;
        }

        /* Section Titles */
        .section-title {
            font-size: 18px;
            color: #0f172a;
            margin-bottom: 16px;
            font-weight: 600;
        }

        /* Dashboard Actions Grid */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .action-card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .action-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .action-card.primary {
            background: #0f172a;
            border-color: #0f172a;
        }

        .action-card.primary:hover {
            background: #1e293b;
        }

        .action-card.primary .action-title {
            color: white;
        }

        .action-card.secondary {
            background: white;
            border-color: #cbd5e1;
        }

        .action-card.secondary:hover {
            border-color: #0f172a;
        }

        .action-title {
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="brand">Advance Billing System</div>
        <div class="navbar-actions">
            <a href="{% url 'user_logout' %}" class="nav-btn btn-logout">Logout</a>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container">

        <!-- Welcome Banner -->
        <div class="welcome-card">
            <span class="badge">Admin Panel</span>
            <h1>Welcome to Admin Dashboard</h1>
            <p>Admin login route and dashboard are working successfully.</p>
        </div>
    </div>

</body>
</html>
