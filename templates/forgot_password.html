<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | Advance Billing</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #374151
                );

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.30);
        }

        .icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            border-radius: 16px;

            background: #111827;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 28px;
        }

        h1 {
            text-align: center;
            color: #111827;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;

            color: #6b7280;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #374151;

            font-size: 14px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 14px;

            border:
                1px solid #d1d5db;

            border-radius: 10px;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #111827;

            box-shadow:
                0 0 0 3px
                rgba(17, 24, 39, 0.10);
        }

        .btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #111827;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .btn:hover {
            background: #000000;
        }

        .error {
            background: #fee2e2;

            color: #b91c1c;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;
        }

        .back {
            text-align: center;

            margin-top: 25px;

            font-size: 14px;
        }

        .back a {
            color: #111827;

            font-weight: bold;

            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="icon">
            🔐
        </div>

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter your username and we'll generate
            a verification OTP to reset your password.
        </p>

        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn"
            >
                Send OTP
            </button>

        </form>

        <div class="back">

            <a href="{% url 'admin_login' %}">
                ← Back to Login
            </a>

        </div>

    </div>

</div>

</body>

</html>
