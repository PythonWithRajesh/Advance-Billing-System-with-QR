<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Distributor Login | Advance Billing</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #064e3b, #047857);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background: #047857;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #064e3b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .badge {
            width: fit-content;
            margin: 0 auto 25px;
            padding: 7px 14px;
            border-radius: 50px;
            background: #d1fae5;
            color: #065f46;
            font-size: 12px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #047857;
            box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.10);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #047857;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #065f46;
            transform: translateY(-1px);
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }

        .success-message {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;

            padding: 12px 14px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 13px;

            text-align: center;
        }

        .switch-login {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #6b7280;
        }

        .switch-login a {
            color: #047857;
            font-weight: bold;
            text-decoration: none;
        }

        .switch-login a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            AB
        </div>

        <h1>Distributor Login</h1>

        <p class="subtitle">
            Advance Billing System
        </p>

        <div class="badge">
            DISTRIBUTOR PORTAL
        </div>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        {% if messages %}

            {% for message in messages %}

                <div class="success-message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Distributor Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter distributor username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <div style="text-align: right; margin: 10px 0 20px;">
                <a
                    href="{% url 'forgot_password' %}"
                    style="
                        color: #047857;
                        font-size: 13px;
                        font-weight: bold;
                        text-decoration: none;
                    "
                >
                    Forgot Password?
                </a>
            </div>

            <button type="submit" class="login-btn">
                Login as Distributor
            </button>
        </form>

        <div class="switch-login">
            Admin?
            <a href="{% url 'admin_login' %}">
                Admin Login
            </a>
        </div>

    </div>

</div>

</body>
</html>
